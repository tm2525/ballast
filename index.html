<title>BALLAST</title>
<style>
:root{
  --bg:#f6f8f7;--panel:#ffffff;--panel2:#eef2f1;--line:#d8e0de;--ink:#13272a;--mute:#5b7370;--dim:#8aa09c;
  --heavy:#c93a2a;--hyp:#6a4fd8;--power:#c98a00;--run:#0f8fae;--rest:#8fa3a0;--ok:#1f9a6d;
  --r:14px;--font:"Barlow Semi Condensed","Avenir Next Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  --onpower:#fff;--toastink:#fff;
}
.topbar{background:rgba(255,255,255,.92)}
.modal{background:rgba(20,40,44,.45)}
.pill.power,.ex .rx{color:#9a6a00}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.topbar .mark{width:30px;height:30px;border-radius:8px;background:var(--power);color:var(--onpower);display:grid;place-items:center;font-weight:900;font-family:var(--mono)}
.topbar .sp{flex:1}
.install{background:var(--power);color:var(--onpower);border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-family:var(--font)}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font-family:var(--font);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .ic{font-family:var(--mono);font-size:16px;line-height:1}
.tabs button.active{color:var(--ink)}
.tabs button.active .ic{color:var(--power)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600}
.stat .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.stat .s{font-size:12px;color:var(--mute);margin-top:2px}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);text-transform:uppercase}
.pill.heavy{border-color:var(--heavy);color:var(--heavy)}.pill.hyp{border-color:var(--hyp);color:var(--hyp)}.pill.power{border-color:var(--power);color:var(--power)}.pill.run{border-color:var(--run);color:var(--run)}.pill.rest{border-color:var(--rest);color:var(--rest)}.pill.ok,.pill.post,.pill.recov{border-color:var(--ok);color:var(--ok)}
/* transit line week */
.line{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 0 2px}
.stn{flex:1;min-width:84px;position:relative;text-align:center;padding-top:22px}
.cnt{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 4px;max-width:360px}.cnt .cn{min-width:84px;text-align:center}.cnt .cn b{display:block;font-family:var(--mono);font-size:34px;line-height:1}.cnt .cn small{color:var(--dim);font-size:11px}
.line.strip{overflow:visible}.line.strip .stn{min-width:0;flex:1 1 0;padding-left:2px;padding-right:2px}.line.strip .stn .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}.line.strip .stn small{display:block;white-space:nowrap}
.stn::before{content:"";position:absolute;top:10px;left:0;right:0;height:4px;background:var(--line)}
.stn:first-child::before{left:50%}.stn:last-child::before{right:50%}
.stn .dot{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--panel);border:4px solid var(--rest)}
.stn.heavy .dot{border-color:var(--heavy)}.stn.power .dot{border-color:var(--power)}.stn.hyp .dot{border-color:var(--hyp)}.stn.run .dot{border-color:var(--run)}.stn.today .dot{background:var(--ink)}
.stn.done .dot{background:var(--ok);border-color:var(--ok)}
.stn .d{font-family:var(--mono);font-size:11px;color:var(--mute)}
.stn .n{font-size:12px;font-weight:600;margin-top:2px;line-height:1.15}
.stn .n small{display:block;color:var(--mute);font-weight:400}
.sess{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sess:first-of-type{border-top:0}
.sess .bar{width:5px;border-radius:3px;background:var(--rest);flex-shrink:0}
.sess.heavy .bar{background:var(--heavy)}.sess.power .bar{background:var(--power)}.sess.hyp .bar{background:var(--hyp)}.sess.run .bar{background:var(--run)}
.sess .t{font-weight:700;font-size:16px}.sess .m{color:var(--mute);font-size:13px}
.sess .chk{font-family:var(--mono);color:var(--ok);font-size:18px}
.ex{border-top:1px solid var(--line);padding:10px 0}
.ex .nm{font-weight:700}.ex .rx{font-family:var(--mono);font-size:13px;color:var(--power)}.ex .cue{font-size:13px;color:var(--mute);margin-top:3px}
.ex .blk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.log{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.log label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:block}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-family:var(--mono);font-size:15px}
input[type=checkbox]{width:auto}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 14px;font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer}
.btn.primary{background:var(--power);color:var(--onpower);border-color:var(--power)}
.btn.danger{border-color:var(--heavy);color:var(--heavy)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,15,17,.7);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.mc{background:var(--panel);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.mc .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mc .x{margin-left:auto;background:none;border:0;color:var(--mute);font-size:26px;line-height:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-top:0}
td.mono{font-family:var(--mono)}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cal .wk{background:var(--panel2);border-radius:8px;padding:8px 6px;text-align:center;border:1px solid transparent}
.cal .wk.cur{border-color:var(--power)}.cal .wk.deload{opacity:.65}.cal .wk.test{border-color:var(--run)}
.cal .wk .w{font-family:var(--mono);font-size:10px;color:var(--mute)}
.cal .wk .k{font-family:var(--mono);font-size:14px;font-weight:600}
.cal .wk .p{font-size:10px;color:var(--mute)}
svg text{font-family:var(--mono);font-size:10px;fill:var(--mute)}
.ladder{display:flex;gap:4px;align-items:flex-end;height:70px}
.ladder div{flex:1;background:var(--line);border-radius:3px 3px 0 0;position:relative}
.ladder div.cur{background:var(--power)}.ladder div.test{background:var(--run)}.ladder div.done{background:var(--ok)}
.ladder div span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;color:var(--mute)}
p{margin:6px 0}
.note{font-size:13px;color:var(--mute)}
ul{margin:6px 0 6px 18px;padding:0}li{margin:3px 0}
.guide h2{margin:14px 0 4px}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:8px;font-family:var(--mono);font-weight:600}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
/* live session */
.live{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.live[hidden]{display:none}
.live .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.live .prog div{height:100%;background:var(--ok);transition:width .3s}
.live .hdr{display:flex;align-items:center;gap:10px;margin:10px 0}
.live .big{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.live .nm{font-size:30px;font-weight:800;line-height:1.05;margin:6px 0}
.live .rx{font-family:var(--mono);font-size:19px;color:var(--power);margin:4px 0}
.live .cue{color:var(--mute);font-size:15px;max-width:420px;margin:6px auto}
.live .sets{display:flex;gap:10px;justify-content:center;margin:18px 0}
.live .sets button{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--panel);color:var(--mute);font-family:var(--mono);font-size:18px;font-weight:700}
.live .sets button.on{background:var(--ok);border-color:var(--ok);color:#06231a}
.live .timer{font-family:var(--mono);font-size:64px;font-weight:600;line-height:1;margin:6px 0;color:var(--ink)}
.live .timer.rest{color:var(--run)}.live .timer.go{color:var(--ok)}
.live .ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.live .ctl .btn{padding:16px 10px;font-size:17px}
.live .next{font-size:13px;color:var(--dim);text-align:center;margin-top:8px}
.live .up{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.num{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}.num input{border:0;border-radius:0;background:transparent;text-align:center;min-width:0;padding:9px 2px}.num .stp{border:0;background:var(--panel);color:var(--ink);font-size:18px;width:34px;flex:0 0 34px;font-family:var(--mono)}.num .stp:active{background:var(--line)}
.live .num{max-width:150px;margin:0 auto}.live .num .stp{width:40px;flex-basis:40px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mute);cursor:pointer}.chip b{color:var(--ink);font-weight:600}
.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
@media(min-width:900px){main{max-width:1040px}.grid2{grid-template-columns:repeat(4,1fr)}.cal{grid-template-columns:repeat(13,1fr)}.tabs{max-width:1040px;margin:0 auto;left:0;right:0}.mc{max-width:760px;border-radius:18px;margin-bottom:4vh}.modal{align-items:center}.live .nm{font-size:40px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="mark">B</div>
  <div><div class="eyebrow">CONCURRENT STRENGTH · ENDURANCE</div><h1>BALLAST</h1></div>
  <div class="sp"></div>
  <button id="installBtn" class="install" hidden>Install</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-view="today" class="active"><span class="ic">●</span>Today</button>
  <button data-view="week"><span class="ic">—</span>Week</button>
  <button data-view="block"><span class="ic">▦</span>Block</button>
  <button data-view="progress"><span class="ic">↗</span>Progress</button>
  <button data-view="library"><span class="ic">≡</span>Library</button>
  <button data-view="settings"><span class="ic">⚙</span>Setup</button>
</nav>
<div id="modal" class="modal" hidden><div class="mc"><div class="hd"><div id="modalTitle"></div><button class="x" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<div id="live" class="live" hidden></div>
<script>
/* ============ BALLAST ENGINE ============ */
const KEY='ballast1';
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DEFAULT={
  startDate:null,
  lifts:{ squat:{name:'Back squat',rm5:60,goal:100,step:2.5,hist:[]}, rdl:{name:'Romanian deadlift',rm5:50,goal:90,step:2.5,hist:[]} },
  burpee:{best:null,hist:[],goalSec:600}, // hist: EMOM ladder logs {d,reps,hit,proj}; proj = projected 100-burpee time, no testing
  sauna:{hist:[]}, // {d,min,temp}
  box:{cur:50,goal:75,unit:'cm',hist:[]}, // box jump working height; progresses on clean 4×3
  structure:{strength:2,runs:1,power:1,surgeon:true,level:'athlete',timer:true,floating:true,ramps:true,fillers:true,saver:true}, // floating: sessions in order, any day // surgeon: optional back & neck block; level: 'standard' | 'athlete'
  theme:'light', bar:20, lastBackup:null, notify:false,
  undo:null, deloadWeeks:[], missedAck:null, bounds:{}, extraSess:{}, // bounds: week starts moved by 'start next week now'; extraSess: bonus sessions added per week engine:{k5:[],p20:[]}, // undo snapshot · forced deload weeks · missed-week prompt ack · 5k & 20-min power log
  exnote:{}, fav:{}, exlog:{}, exvid:{}, // exvid: your own video link per exercise (overrides the search) exvid:{}, // exvid: your preferred video link per exercise // per-exercise: personal note, favourite, history of best live sets {d,kg,reps}
  base:null, // baseline snapshot at onboarding {sq,rd,box,d} — drives the "since start" strip
  slots:{A:0,B:3,C:4,P1:2,P2:5},  // day index per slot
  bw:null,
  log:{}, // key: `${weekKey}|${sessionId}` -> {done, sets:{exId:{kg,reps,rir}}, note}
  completedWeeks:{},
  plate:1.25, // smallest plate you own (per side) — barbell loads are rounded to what you can actually put on the bar
  custom:{} // exercises you typed in yourself, learned into the library: key -> {n,cat,m,eq,cue,mine:true}
};
const clone=o=>JSON.parse(JSON.stringify(o)); // structuredClone needs iOS 15.4+
let S=load();
function applyTheme(){try{document.documentElement.dataset.theme='light';S.theme='light'}catch(e){}}
applyTheme();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j==='object'){const m=deepMerge(clone(DEFAULT),j);for(const k of ['lifts','burpee','box','structure','slots','log','sauna','exnote','fav','exlog','exvid','custom'])if(!m[k]||typeof m[k]!=='object')m[k]=clone(DEFAULT[k]);if(m.box.unit==='in'){const q=v=>Math.round(v*2.54/2.5)*2.5;m.box.cur=q(m.box.cur);m.box.goal=q(m.box.goal)}m.box.unit='cm';(m.burpee.hist||[]).forEach(h=>{if(h&&h.mins&&h.hit>h.mins){h.hit=h.mins;h.proj=null}});Object.values(m.log).forEach(l=>{if(l&&l.live)Object.keys(l.live).forEach(i=>{l.live[i]=Array.from(l.live[i]||[],e=>e||{})})});return m}}catch(e){console.error('state reset',e)}return clone(DEFAULT)}
let memOnly=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!memOnly){memOnly=true;setTimeout(()=>toast('Storage blocked here — data lives in memory only. Open the file in Safari or install it.'),300)}}} // sandboxed previews block storage
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]||{},b[k])}else a[k]=b[k]}return a}
const r25=x=>Math.round(x/2.5)*2.5;
/* barbell loads snap to bar + pairs of your smallest plate (ties round down) */
function loadable(kg){const bar=S.bar||20,st=2*(S.plate||1.25);if(kg<=bar)return bar;return bar+Math.floor((kg-bar)/st+0.5-1e-9)*st}
const e1rm=(w,r)=>w*(1+r/30);
const pctFor5=(rm5)=>e1rm(rm5,5); // estimated 1RM from 5RM

// 4-week waves: 1 build, 2 build, 3 peak, 4 deload+test
const WAVE=[
  {w:1,label:'Build I',  top:{pct:.80,reps:5,sets:4,rir:'2–3'}, back:{pct:.72,reps:5,sets:2}},

  {w:4,label:'Deload', top:{pct:.70,reps:5,sets:2,rir:'3+'}, back:{pct:.65,reps:5,sets:1}, deload:true}
];
const WAVE_END={w:4,label:'Deload · endurance',top:{pct:.55,reps:15,sets:2,rir:'4+'},back:{pct:.45,reps:20,sets:1},deload:true,endurance:true};
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function iso(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`} // local date, not UTC (BST bug)
function pdate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)} // local parse
function weekStart(wi){const base=S.startDate?pdate(S.startDate):mondayOf(new Date());base.setHours(0,0,0,0);const B=S.bounds||{};let aw=0,anchor=base;const ks=Object.keys(B).map(Number).filter(k=>k<=wi&&k>0).sort((a,b)=>b-a);if(ks.length){aw=ks[0];anchor=pdate(B[aw])}const d=new Date(anchor);d.setDate(d.getDate()+(wi-aw)*7);return d}
function weekIndex(date=new Date()){if(!S.startDate)return 0;const b=new Date(date);b.setHours(0,0,0,0);let wi=0;for(let w=1;w<120;w++){if(weekStart(w)<=b)wi=w;else break}return wi}
function advanceWeek(){const wi=weekIndex();const t=new Date();t.setHours(0,0,0,0);if(weekStart(wi+1)<=t)return;if(weekStart(wi).getTime()===t.getTime()){toast('Already on day 1 of this week — advance from tomorrow');return}S.bounds=S.bounds||{};S.bounds[wi+1]=iso(t);save();toast('Week '+(wi+2)+' starts today')}
function weekKey(date=new Date()){return iso(weekStart(weekIndex(date)))} // key = that plan-week's first day
function floating(){return S.structure.floating!==false}
function wave(wi){const dl=S.structure.deload==='endurance'?WAVE_END:WAVE[3];if((S.deloadWeeks||[]).includes(wi))return dl;return wi%4===3?dl:WAVE[wi%4]}
/* endurance deload: accessories go light and long, far from failure; goal lifts, ramps, plyos, intervals, sauna untouched */
function enduranceRx(x){if(x.log||x.ramp||x.int||x.sauna||x.box||x.burpee||x.filler||x.blk==='Finisher')return x;const c=(LIB[x.e]||{}).cat;if(c==='hyp'||(c==='heavy'&&!x.log))return{...x,rx:'2×15–20 light · RIR 4+ · move fast'};if(c==='post')return{...x,rx:x.rx};return x}
function lowReadinessStreak(){const r=Object.values(S.log).filter(l=>l.done&&l.ready!=null&&l.at).sort((a,b)=>a.at.localeCompare(b.at)).slice(-3).map(l=>l.ready);return r.length>=2&&r.slice(-2).every(x=>x<=4)}

  bss:{n:'Bulgarian split squat',cat:'heavy',m:['quads','glutes'],eq:'dumbbells',cue:'Front-shin vertical-ish, drive through whole foot. DBs or barbell.',how:'Rear foot on a bench, front foot far enough forward that the shin stays near vertical. Lower straight down, slight forward lean for glutes, upright for quads.',faults:['Front foot too close (knee far over toes)','Bouncing off the back knee','Hip hiking'],tempo:'2s down · drive',reg:'splitSq',prog:'bssFFE',alt:['revlunge','stepup','splitSq']},

  deficitRDL:{n:'Deficit RDL',cat:'heavy',m:['hams','glutes','back'],eq:'barbell',cue:'Stand on a 5–10cm plate or block; the bar travels below the feet so the hamstrings are loaded at longer length. Lighter than your flat RDL — ~80–85% of it.',how:'Feet on the block, bar at the hips. Hinge with soft knees until the bar passes mid-shin or lower — the deficit lets it go further — keeping the back flat and the bar on the thighs. Stand by driving the hips through.',faults:['Rounding to chase depth','Bending the knees into a squat','Bar drifting forward'],tempo:'3s down · 1s pause · drive',reg:'rdl',alt:['rdl','sumoRDL','ghr']},
  deficitLunge:{n:'Deficit reverse lunge',cat:'heavy',m:['glutes','quads'],eq:'dumbbells',cue:'Front foot on a 10–15cm step, step back and down past the step height. Big glute stretch, knee-friendly.',how:'Stand on the step with DBs at the sides. Step back and lower until the back knee is just off the floor and the front hip is below the step, torso leaning slightly forward. Drive up through the front heel.',faults:['Short steps','Collapsing the front knee inward','Pushing off the back foot'],tempo:'3s down · drive',reg:'revlunge',alt:['revlunge','bssFFE','stepup']},
  heelSq:{n:'Cycling squat / heels-elevated squat',cat:'heavy',m:['quads','glutes'],eq:'barbell',cue:'Heels on a 2–5cm wedge or plates, narrow stance, torso upright, knees travel forward. Pure quad — the “cycling” squat.',how:'Bar on the back (or goblet / front rack). Heels raised, feet hip-width, sit straight down keeping the chest tall, let the knees go well past the toes, full depth. Lighter than your back squat — ~70–80%.',faults:['Hips shooting back (turns it into a normal squat)','Heels lifting off the wedge','Cutting depth'],tempo:'3s down · 1s pause · up',reg:'gobletp',alt:['frontsq','gobletp','squatPause']},
  deficitPushup:{n:'Deficit push-up',cat:'hyp',m:['shoulders','core'],eq:'none',cue:'Hands on two blocks or DB handles; chest goes below hand level for extra range.',how:'Hands on raised blocks, body in a line, lower until the chest passes the hands, press back up. Elbows ~45°.',faults:['Sagging hips','Flaring elbows','Short range'],tempo:'3s down · press',reg:'pushup',alt:['pushup','triPush']},
  deficitCalf:{n:'Deficit calf raise',cat:'hyp',m:['calves'],eq:'box',cue:'Balls of the feet on a step, heels dropping well below; pause in the stretch, full rise.',how:'Toes on the edge of a step, lower the heels as far as they go, hold 2s, rise all the way up onto the toes and squeeze. Add a DB or a bar across the back.',faults:['Bouncing out of the bottom','Half range at the top'],tempo:'2s down · 2s stretch · up',reg:'calf',alt:['calf','seatcalf','calfSL']},
  splitSq:{n:'Split squat (static)',cat:'heavy',m:['quads','glutes'],eq:'dumbbells',cue:'Both feet on the floor; the simplest unilateral pattern.',how:'Long stride, lower the back knee to just off the floor, drive through the front foot.',faults:['Short stride','Pushing off the back foot'],tempo:'2s down · drive',prog:'bss',alt:['bss','revlunge']},
  stepup:{n:'Weighted step-up',cat:'heavy',m:['quads','glutes'],eq:'box',cue:'Knee-height box, no push-off from trailing leg, control the descent.',how:'Whole foot on the box, lean in slightly, drive up through the heel without pushing off the floor. Lower under control to a light touch.',faults:['Pushing off the trailing foot','Dropping down','Box too low'],tempo:'drive · 3s down',reg:'stepupLow',prog:'stepupHigh',alt:['bss','revlunge','lunge']},
  stepupLow:{n:'Step-up (low box)',cat:'heavy',m:['quads','glutes'],eq:'box',cue:'Shin height; emphasise the slow eccentric.',how:'As the step-up, lower box, control the step down over 3s.',faults:['Rushing the descent'],tempo:'drive · 3s down',prog:'stepup',alt:['stepup','sledDrag']},
  stepupHigh:{n:'High step-up (above knee)',cat:'heavy',m:['glutes','quads'],eq:'box',cue:'Box above knee height; glute dominant; light load, strict.',how:'Hands free or a light DB, no momentum. Full hip extension at the top.',faults:['Hopping off the floor'],tempo:'drive · 3s down',reg:'stepup',alt:['stepup','bssFFE']},
  revlunge:{n:'Reverse lunge',cat:'heavy',m:['quads','glutes'],eq:'dumbbells',cue:'Long step back, front shin near vertical, drive up through the front heel. Knee-friendlier than forward lunges.',how:'Step back, lower the back knee to just off the floor, drive through the front foot to stand. DBs at the sides or a bar on the back.',faults:['Short step','Pushing off the back foot','Torso collapsing'],tempo:'2s down · drive',reg:'splitSq',prog:'revlungeDef',alt:['bss','lunge','stepup']},
  revlungeDef:{n:'Deficit reverse lunge',cat:'heavy',m:['glutes','quads'],eq:'dumbbells',cue:'Front foot on a 10cm step; more glute stretch.',how:'As the reverse lunge from a step.',faults:['Losing the vertical shin'],tempo:'3s down · drive',reg:'revlunge',alt:['bssFFE','revlunge']},
  lunge:{n:'Walking lunge',cat:'hyp',m:['quads','glutes'],eq:'dumbbells',cue:'Long stride, torso slightly forward for glutes.',how:'Step long, lower until the back knee nearly touches, drive through the front foot into the next step.',faults:['Short steps','Wobbling knees','Leaning back'],tempo:'continuous',reg:'splitSq',alt:['revlunge','bss']},
  calf:{n:'Standing calf raise (heavy)',cat:'heavy',m:['calves'],eq:'machine',cue:'3s eccentric, full stretch at the bottom, pause at top.',how:'Balls of the feet on a step, straight knees, rise to the top and pause, lower over 3s to a full stretch.',faults:['Bouncing out of the bottom','Bending the knees','Partial range'],tempo:'1s up · 1s hold · 3s down',reg:'calfBW',prog:'calfSL',alt:['calfSL','seatcalf']},
  calfBW:{n:'Bodyweight calf raise (step)',cat:'hyp',m:['calves'],eq:'step',cue:'Slow, full range, pause at both ends.',how:'As the standing calf raise without load; 15–25 reps.',faults:['Bouncing'],tempo:'2s up · 2s hold · 3s down',prog:'calf',alt:['calf','seatcalf']},
  calfSL:{n:'Single-leg calf raise',cat:'hyp',m:['calves'],eq:'step',cue:'One leg, DB in hand, finger on the wall for balance.',how:'As the standing calf raise on one leg.',faults:['Rolling onto the outside of the foot'],tempo:'1s up · 1s hold · 3s down',reg:'calf',alt:['calf']},
  farmer:{n:'Farmer carry',cat:'heavy',m:['core','back','calves'],eq:'dumbbells',cue:'Heavy as you can hold for the distance; tall, quiet shoulders.',how:'Deadlift the handles up, stand tall, walk with quick small steps. Shoulders back, ribs down.',faults:['Leaning forward','Shrugging','Running'],tempo:'walk · 30–40m',prog:'suitcase',alt:['suitcase','rackCarry']},
  suitcase:{n:'Suitcase carry',cat:'heavy',m:['core','back'],eq:'dumbbells',cue:'One side only; resist the lean. Swap halfway.',how:'One heavy DB at the side; walk tall without leaning away from it.',faults:['Leaning away from the load','Hiking the hip'],tempo:'walk · 30m/side',reg:'farmer',alt:['farmer','pallof']},
  rackCarry:{n:'Front-rack KB carry',cat:'heavy',m:['core','shoulders','back'],eq:'kettlebell',cue:'Bells in the rack, elbows in, ribs down; brutal on the trunk.',how:'Clean two bells to the rack and walk tall.',faults:['Elbows flaring','Leaning back'],tempo:'walk · 20–30m',alt:['farmer','farmerlight']},
  emomComplex:{n:'EMOM · squat + swing complex',cat:'heavy',m:['quads','glutes','cond'],eq:'barbell',cue:'Odd minutes: 8 front squats at ~50% top set. Even: 10 heavy swings. Rest what is left of the minute. Legs never fully recover — that is the stimulus.',how:'Set the bar and bell up next to each other. Hold form on the squats as the swings accumulate.',faults:['Loads too heavy to finish','Form collapse by minute 8'],tempo:'EMOM 12',alt:['e2momRun','intLunge']},
  e2momRun:{n:'E2MOM · RDL + run',cat:'heavy',m:['hams','glutes','cond'],eq:'barbell',cue:'Every 2 min × 6: 6 RDL at ~60% top set, then 150m hard run (or 30s bike). The hinge under fatigue is the Hyrox pattern.',how:'Bar set up by the treadmill or track. Hinge pattern must stay clean when breathing hard.',faults:['Rounding the RDLs when tired'],tempo:'E2MOM × 6',alt:['emomComplex','intLunge']},

  // ===== HYPERTROPHY · GLUTES / LEGS =====
  thrust:{n:'Hip thrust',cat:'hyp',m:['glutes','hams'],eq:'barbell',cue:'Chin tucked, ribs down, full lockout squeeze.',how:'Upper back on a bench, bar over the hips (pad), feet so the shins are vertical at the top. Drive the hips up to a flat line, squeeze 2s, lower under control.',faults:['Overextending the lower back at the top','Feet too far forward (hamstrings take over)','Short range'],tempo:'drive · 2s squeeze · 2s down',reg:'glBridge',prog:'slbridge',alt:['hipext45','slbridge','glBridge']},
  glBridge:{n:'Glute bridge (floor)',cat:'hyp',m:['glutes'],eq:'floor',cue:'Floor version; band around knees for glute med.',how:'Feet flat, drive the hips up, squeeze, lower. Barbell or DB on the hips to load.',faults:['Pushing through the toes','Arching the back'],tempo:'drive · 2s squeeze',prog:'thrust',alt:['thrust','slbridge']},
  slbridge:{n:'Single-leg glute bridge / thrust',cat:'hyp',m:['glutes','hams'],eq:'bench',cue:'Shoulders on a bench, one foot down, pelvis level, full lockout. Fixes the side that lags.',how:'As the hip thrust on one leg; keep the pelvis level and the free knee bent.',faults:['Pelvis rotating','Hamstring cramping (foot too far out)'],tempo:'drive · 2s squeeze · 2s down',reg:'thrust',alt:['thrust','kickback']},
  hipext45:{n:'45° hip extension (glute-biased)',cat:'hyp',m:['glutes','hams'],eq:'back-extension bench',cue:'Round the upper back slightly, toes out, squeeze glutes at the top — not a low-back exercise. Hold a plate.',how:'Pad just below the hips, toes turned out, round the upper back and lower under control; drive up with the glutes, stop at a straight line.',faults:['Hyperextending the back','Using the lower back to lift'],tempo:'2s down · squeeze',reg:'bext',alt:['thrust','ghr','kickback']},
  kickback:{n:'Cable kickback',cat:'hyp',m:['glutes'],eq:'cable',cue:'Slight forward lean, knee soft, drive the heel back and up; 2s squeeze. Upper glute max.',how:'Ankle strap at the lowest pulley, hold the frame, kick back and slightly out without arching the back.',faults:['Arching the back','Swinging'],tempo:'drive · 2s squeeze · 2s return',reg:'glBridge',alt:['abd','slbridge','hipext45']},
  abd:{n:'Seated / banded hip abduction',cat:'hyp',m:['glutes'],eq:'machine',cue:'Lean forward for glute med, upright for upper glute max. High reps, burn is the point.',how:'Push the knees out against the pads; pause at the widest point. 15–25 reps.',faults:['Rushing','Short range'],tempo:'1s out · 1s hold · 2s in',alt:['kickback','clam','bandWalk']},
  clam:{n:'Banded clamshell',cat:'hyp',m:['glutes'],eq:'band',cue:'Side-lying, band above knees, open the top knee without rolling the hip back.',how:'Hips stacked, feet together, lift the top knee; feel the side of the glute.',faults:['Rolling the pelvis back'],tempo:'2s out · 1s hold',prog:'abd',alt:['bandWalk','abd']},
  bandWalk:{n:'Lateral band walk',cat:'hyp',m:['glutes'],eq:'band',cue:'Band above knees or at ankles, quarter squat, small steps, toes forward.',how:'Stay low and level; 10–15 steps each way.',faults:['Standing up tall','Toes turning out'],tempo:'continuous',prog:'abd',alt:['clam','abd']},
  legcurl:{n:'Nordic / leg curl',cat:'hyp',m:['hams'],eq:'machine',cue:'Nordics once a week max in heavy endurance blocks; otherwise machine or slider curl.',how:'Nordic: knees on a pad, ankles held, lower the body as slowly as possible, push back up. Machine curl: full range, 2s eccentric.',faults:['Hips bending (Nordic)','Dropping too fast'],tempo:'3–5s down',reg:'sliderCurl',prog:'nordic',alt:['ghr','sliderCurl','rdlight']},
  nordic:{n:'Nordic hamstring curl',cat:'hyp',m:['hams'],eq:'partner/anchor',cue:'The gold-standard hamstring eccentric; once a week max in heavy blocks.',how:'Kneel with the ankles anchored, hips straight, lower the body over 3–5s, catch with the hands, push back.',faults:['Hinging at the hips','Too many reps too soon'],tempo:'3–5s down',reg:'legcurl',alt:['ghr','legcurl']},
  ghr:{n:'Glute-ham raise / slider curl',cat:'hyp',m:['hams','glutes'],eq:'GHD or sliders',cue:'Hips extended throughout; lower under control, pull back with hamstrings.',how:'GHD: lower to horizontal keeping the hips straight, curl back up. Slider: heels on sliders in a bridge, slide out and back without dropping the hips.',faults:['Hips sagging','Using the lower back'],tempo:'3s out · 2s in',reg:'sliderCurl',alt:['legcurl','nordic']},
  sliderCurl:{n:'Slider hamstring curl',cat:'hyp',m:['hams','glutes'],eq:'sliders',cue:'Bridge, slide the heels out, pull back in; hips stay up.',how:'On the back with heels on sliders, bridge, extend the legs and curl them back.',faults:['Hips dropping'],tempo:'3s out · 2s in',prog:'ghr',alt:['ghr','legcurl']},
  rdlight:{n:'Single-leg RDL (DB)',cat:'hyp',m:['hams','glutes'],eq:'dumbbells',cue:'Hip stays square; a tendon-friendly hamstring builder.',how:'DB in the opposite hand, hinge on one leg with the back leg extending behind; hip stays level; return by driving the hip.',faults:['Hip opening up','Rounding','Knee locking'],tempo:'3s down · drive',reg:'rdl',alt:['rdl','ghr','kickstandRDL']},
  kickstandRDL:{n:'Kickstand RDL',cat:'hyp',m:['hams','glutes'],eq:'dumbbells',cue:'Rear toe on the floor for balance; 80% on the front leg.',how:'Stagger stance, hinge over the front leg.',faults:['Loading the back leg'],tempo:'3s down · drive',prog:'rdlight',alt:['rdlight','rdl']},
  seatcalf:{n:'Seated calf raise',cat:'hyp',m:['calves'],eq:'machine',cue:'Soleus bias; 2s pause at the bottom.',how:'Pad on the knees, full stretch at the bottom with a pause, rise onto the toes.',faults:['Bouncing'],tempo:'1s up · 1s hold · 2s down',alt:['calf','calfBW']},
  tibRaise:{n:'Tibialis raise',cat:'hyp',m:['calves'],eq:'wall',cue:'Back against a wall, heels out, lift the toes. Shin-splint insurance.',how:'Lean on a wall with feet 30cm out, lift the toes as high as possible, lower slowly. 20–25 reps.',faults:['Bending the knees'],tempo:'1s up · 2s down',alt:['calfBW']},
  legExt:{n:'Leg extension',cat:'hyp',m:['quads'],eq:'machine',cue:'Full lockout squeeze; slow eccentric. Tendon-friendly at higher reps.',how:'Pad on the shins, extend fully, hold a second, lower over 3s.',faults:['Swinging','Partial range'],tempo:'1s up · 1s hold · 3s down',alt:['sledDrag','frontsq']},
  legPress:{n:'Leg press',cat:'hyp',m:['quads','glutes'],eq:'machine',cue:'Feet mid-platform, full depth without the lower back lifting.',how:'Lower until the knees are at ~90° or deeper if the pelvis stays down; press without locking out hard.',faults:['Pelvis tucking at the bottom','Bouncing'],tempo:'2s down · drive',alt:['squat','frontsq']},
  intLunge:{n:'Every 90s × 8 · lunges + burpees',cat:'hyp',m:['quads','glutes','cond'],eq:'dumbbells',cue:'10 walking lunges with DBs then 6 burpees; rest the remainder. Hold the pace of round 1 to round 8.',how:'Light DBs. Lunges long and controlled, burpees to the full standard.',faults:['Lunges turning into shuffles'],tempo:'every 90s × 8',alt:['emomComplex','e2momRun']},

  // ===== HYPERTROPHY · UPPER BACK / SHOULDERS =====
  rows:{n:'Chest-supported row',cat:'hyp',m:['back'],eq:'incline bench + DBs',cue:'Elbows ~45°, squeeze scapulae, no body English.',how:'Chest on an incline bench, DBs hanging, row to the hips with the elbows at 45°, pause and squeeze the shoulder blades.',faults:['Shrugging','Lifting the chest off the bench','Flaring elbows'],tempo:'pull · 1s squeeze · 2s down',alt:['cableRow','bbRow','pullup']},
  bbRow:{n:'Barbell row',cat:'hyp',m:['back','hams'],eq:'barbell',cue:'Hinge to 45°, row to the lower ribs, hold the hinge.',how:'RDL position, pull the bar to the lower chest, elbows back, lower under control.',faults:['Standing up with the weight','Jerking'],tempo:'pull · 1s · 2s down',reg:'rows',alt:['rows','cableRow']},
  cableRow:{n:'Seated cable row',cat:'hyp',m:['back'],eq:'cable',cue:'Chest up, pull to the navel, let the scapulae protract on the return.',how:'Neutral grip, drive the elbows back, squeeze; control the stretch forward.',faults:['Leaning back','Rounding on the stretch'],tempo:'pull · 1s · 2s out',alt:['rows','pullup']},
  pullup:{n:'Pull-up / lat pulldown',cat:'hyp',m:['back','shoulders'],eq:'bar',cue:'Full hang to chin over bar; add load when 3×10 is clean.',how:'Dead hang, pull the elbows down and back, chin over the bar, lower fully. Pulldown: same path, chest up, bar to the upper chest.',faults:['Kipping','Half reps','Shrugging into the ears'],tempo:'pull · 2s down',reg:'pulldown',prog:'pullupW',alt:['pulldown','cableRow']},
  pulldown:{n:'Lat pulldown',cat:'hyp',m:['back'],eq:'cable',cue:'Bar to the upper chest, elbows down and in, no leaning back.',how:'Slight lean, pull to the collarbone, control the return to a full stretch.',faults:['Pulling behind the neck','Leaning way back'],tempo:'pull · 2s up',prog:'pullup',alt:['pullup','cableRow']},
  pullupW:{n:'Weighted pull-up',cat:'hyp',m:['back','shoulders'],eq:'bar + belt',cue:'Load once 3×10 bodyweight is strict; 5–8 reps.',how:'As the pull-up with a dip belt.',faults:['Range shrinking as load rises'],tempo:'pull · 2s down',reg:'pullup',alt:['pullup']},
  facepull:{n:'Face pull',cat:'hyp',m:['shoulders','back'],eq:'cable or band',cue:'High reps, external rotation at the end.',how:'Rope at face height, pull towards the forehead with the elbows high, finish with the hands rotated back. 15–25 reps.',faults:['Too heavy','Elbows dropping'],tempo:'pull · 1s · 2s out',alt:['pullapart','cobra','rearDelt']},
  rearDelt:{n:'Rear-delt fly',cat:'hyp',m:['shoulders','back'],eq:'dumbbells',cue:'Hinged, light DBs, arms out to the side, thumbs down slightly.',how:'Hinge to 45°, raise the DBs out to the sides with soft elbows, pause.',faults:['Swinging','Using the traps'],tempo:'raise · 1s · 2s down',alt:['facepull','pullapart']},
  press:{n:'DB shoulder press',cat:'hyp',m:['shoulders','core'],eq:'dumbbells',cue:'Seated or standing; control the eccentric.',how:'DBs at the shoulders, press to lockout without flaring the ribs, lower to ear height.',faults:['Arching the lower back','Short range'],tempo:'press · 2s down',reg:'landmine',prog:'ohp',alt:['ohp','landmine']},
  ohp:{n:'Barbell overhead press',cat:'hyp',m:['shoulders','core'],eq:'barbell',cue:'Glutes tight, bar path straight, head through at the top.',how:'Bar on the front delts, brace, press straight up moving the head back then through.',faults:['Leaning back','Pressing around the face'],tempo:'press · 2s down',reg:'press',alt:['press','landmine']},
  landmine:{n:'Landmine press',cat:'hyp',m:['shoulders','core'],eq:'landmine',cue:'Half-kneeling or standing; shoulder-friendly angle.',how:'Bar end at the shoulder, press up and forward along the arc.',faults:['Twisting'],tempo:'press · 2s down',prog:'press',alt:['press','ohp']},
  lateral:{n:'Lateral raise',cat:'hyp',m:['shoulders'],eq:'dumbbells',cue:'Lead with elbows, slight forward lean, light and strict.',how:'Slight lean forward, raise the DBs out to shoulder height with the elbows leading, lower over 2s.',faults:['Swinging','Shrugging','Going above shoulder height'],tempo:'raise · 2s down',alt:['cableLat','press']},
  cableLat:{n:'Cable lateral raise',cat:'hyp',m:['shoulders'],eq:'cable',cue:'Constant tension; cable behind the body.',how:'Low pulley, cable crossing behind you, raise to shoulder height.',faults:['Leaning away'],tempo:'raise · 2s down',alt:['lateral']},
  pushup:{n:'Push-up',cat:'hyp',m:['chest','shoulders','core'],eq:'floor',cue:'Body in one line, chest to the floor, elbows at 45°.',how:'Hands under the shoulders, lower until the chest touches, press back up without the hips sagging.',faults:['Hips sagging','Elbows flaring','Half reps'],tempo:'2s down · press',prog:'dbBench',alt:['dbBench','dip']},
  dbBench:{n:'DB bench press',cat:'hyp',m:['chest','shoulders'],eq:'dumbbells',cue:'Shoulder blades pinned, elbows 45°, full stretch.',how:'Lie back with the DBs, lower to chest level with the elbows tucked, press up and slightly in.',faults:['Flaring','Bouncing'],tempo:'2s down · press',reg:'pushup',alt:['pushup','dip']},
  dip:{n:'Dip',cat:'hyp',m:['chest','shoulders'],eq:'dip bars',cue:'Lean forward for chest, upright for triceps; shoulder below elbow.',how:'Lower until the shoulder is just below the elbow, press out.',faults:['Going too deep for the shoulder','Shrugging'],tempo:'2s down · press',reg:'pushup',alt:['dbBench','pushup']},
  curl:{n:'DB curl',cat:'hyp',m:['arms'],eq:'dumbbells',cue:'Elbows pinned, full range, no swing.',how:'Curl to the shoulder, lower over 2s.',faults:['Swinging'],tempo:'curl · 2s down',alt:['hammer']},
  hammer:{n:'Hammer curl',cat:'hyp',m:['arms'],eq:'dumbbells',cue:'Neutral grip; forearms and brachialis.',how:'As the curl with palms facing in.',faults:['Swinging'],tempo:'curl · 2s down',alt:['curl']},
  triPush:{n:'Triceps pushdown',cat:'hyp',m:['arms'],eq:'cable',cue:'Elbows pinned, full lockout.',how:'Push the rope down and apart, lock out, control up.',faults:['Elbows drifting forward'],tempo:'push · 2s up',alt:['dip','pushup']},

  // ===== SURGEON · BACK & NECK ENDURANCE =====
  chintuck:{n:'Chin tuck + deep-neck-flexor hold',cat:'post',m:['neck'],eq:'floor',cue:'Supine, nod the chin (no lifting the head), hold 10s × 10. Builds the deep flexors that fail first under a loupe-forward head.',how:'Lie on the back, gently nod as if making a double chin, keep the head on the floor. Hold 10s, relax, repeat.',faults:['Lifting the head','Clenching the jaw'],tempo:'10s hold × 10',prog:'chintuckLift',alt:['neckiso']},
  chintuckLift:{n:'Chin tuck with head lift',cat:'post',m:['neck'],eq:'floor',cue:'Nod first, then lift the head 2cm and hold.',how:'As the chin tuck, then lift the head barely off the floor keeping the chin tucked. 5–10s × 8.',faults:['Jutting the chin','Lifting high'],tempo:'5–10s hold',reg:'chintuck',alt:['neckiso']},
  neckiso:{n:'4-way neck isometrics',cat:'post',m:['neck'],eq:'none',cue:'Hand on forehead / each side / back of head; push 50% effort 10s each direction × 3. No movement, no pain.',how:'Seated tall, press the head into the hand without moving. Forehead, each side, back. Breathe.',faults:['Holding the breath','Pushing too hard'],tempo:'10s × 4 directions × 3',alt:['chintuck','neckext']},
  neckext:{n:'Prone neck extension',cat:'post',m:['neck','back'],eq:'bench or band',cue:'Face down, chin tucked, lift head to neutral and hold 5s. The cervical extensors are what cramp at hour three of a case.',how:'Lie face down with the head off a bench, chin tucked, lift the head to neutral (not beyond), hold, lower. Add a light plate on the back of the head to progress.',faults:['Looking up (overextending)','Shrugging'],tempo:'lift · 5s hold · 2s down',reg:'neckiso',alt:['cobra','neckiso']},
  cobra:{n:'Prone cobra / Y-T-W',cat:'post',m:['back','shoulders'],eq:'floor',cue:'Thumbs up, squeeze scapulae down and back, hold 10s. Lower-trap and rotator-cuff endurance.',how:'Face down, arms at 45° (Y), 90° (T) or elbows bent (W), lift the arms and chest slightly, thumbs up, squeeze the shoulder blades down. Hold.',faults:['Using the lower back to lift high','Shrugging'],tempo:'10s hold × 3 each',prog:'yraise',alt:['pullapart','facepull']},
  yraise:{n:'Incline Y-raise',cat:'post',m:['back','shoulders'],eq:'incline bench + DBs',cue:'Very light DBs, thumbs up, raise to a Y, pause.',how:'Chest on an incline bench, raise the arms overhead at 45°, pause at the top.',faults:['Too heavy'],tempo:'raise · 2s hold · 2s down',reg:'cobra',alt:['cobra','facepull']},
  pullapart:{n:'Band pull-apart',cat:'post',m:['back','shoulders'],eq:'band',cue:'High reps (20–30), elbows soft, finish with the band on the chest. Do these between cases too.',how:'Arms straight out in front, pull the band apart until it touches the chest, squeeze, return slowly.',faults:['Shrugging','Bending the elbows'],tempo:'pull · 1s · 2s return',alt:['facepull','rearDelt','cobra']},
  wallslide:{n:'Scapular wall slide',cat:'post',m:['back','shoulders'],eq:'wall',cue:'Forearms on the wall, slide up keeping contact, no rib flare. Thoracic extension + serratus.',how:'Back and forearms against the wall, slide the arms up overhead keeping forearms and lower back in contact.',faults:['Ribs flaring','Losing wall contact'],tempo:'3s up · 3s down',alt:['tspine','cobra']},

function undoCard(){const u=S.undo;if(!u||Date.now()-u.at>864e5)return '';return `<div class="card tight"><div class="row"><span class="note">Completed ${esc(u.title)} · wrong number?</span><span class="sp"></span><button class="btn sm" id="undoBtn">Undo</button></div></div>`}

function missedCheck(wi){if(!S.startDate||wi===0||S.missedAck===weekKey())return '';const done=Object.values(S.log).filter(l=>l.done&&l.at).map(l=>l.at).sort();const last=done[done.length-1];const gap=last?Math.floor((new Date()-pdate(last))/864e5):null;const prevWk=iso(weekStart(wi-1));const prevDone=sessions(wi-1).some(s=>S.log[prevWk+'|'+s.id]?.done);if(prevDone||(gap!=null&&gap<10))return '';return `<div class="card" style="border-color:var(--run)"><b>Looks like last week was missed</b><p class="note">${last?gap+' days since your last session.':'No sessions logged yet in the plan.'} Shift the plan back a week so you pick up where you left off, or carry on from week ${wi+1}.</p><div class="row"><button class="btn primary full" id="shiftWk">Shift plan back 1 week</button><button class="btn full" id="carryOn">Carry on</button></div></div>`}
function plyoContacts(wi){let n=0;sessions(wi).forEach(s=>s.ex.forEach(x=>{if((MUS[x.e]||[])[0]!=='power')return;const m=x.rx.match(/(\d+)×(\d+)/);n+=m?+m[1]*+m[2]:(/20s|20 /.test(x.rx)?3*20:10)}));return n}

function loadCard(){const L=loadStats();if(!L.chronic)return '';const r=L.ratio;const col=r==null?'--mute':r>1.5?'--heavy':r>1.3?'--power':r<0.8?'--run':'--ok';return `<div class="card tight"><div class="row"><h3>Training load</h3><span class="sp"></span><span class="eyebrow">sRPE · 7d vs 28d</span></div><div class="row" style="margin-top:6px"><span class="stat" style="flex:1"><span class="v" style="color:var(${col})">${r?r.toFixed(2):'—'}</span><div class="l">acute:chronic</div><div class="s">${r==null?'baseline '+L.span+'/14 days':r>1.5?'spike — back off':r>1.3?'high — watch it':r<0.8?'detraining risk':'sweet spot 0.8–1.3'}</div></span><span class="stat" style="flex:1"><span class="v">${Math.round(L.acute)}</span><div class="l">daily load (7d)</div><div class="s">RPE × minutes</div></span></div></div>`}
function backupNudge(){const d=S.lastBackup?Math.floor((new Date()-pdate(S.lastBackup))/864e5):null;const n=Object.values(S.log).filter(l=>l.done).length;if(n<3||(d!=null&&d<7))return '';return `<div class="card tight"><div class="row"><span class="note">${d==null?'No backup yet':'Last backup '+d+' days ago'} — data lives on this phone only.</span><span class="sp"></span><button class="btn sm" id="bkNow">Back up</button></div></div>`}

/* one entry line per exercise; logged sets become small chips underneath (tap × to remove). Rows live in rowSets (keys <prefix>s<n>) and are merged by collect(). */
let rowSets={};
function rowsFor(prefix){return Object.keys(rowSets).filter(q=>q.startsWith(prefix+'s')&&/^s\d+$/.test(q.slice(prefix.length))).sort((a,b)=>+a.slice(prefix.length+1)-+b.slice(prefix.length+1)).map(q=>rowSets[q])}
function setEntry(prefix,x,def,bw){const rows=rowsFor(prefix);const last=rows[rows.length-1]||{};const tgt=setsOf(x);const secs=/\d+s/.test(x.rx||'');
  const chips=rows.length?`<div class="chips">${rows.map((r,n)=>`<span class="chip" data-rm="${prefix}" data-n="${n}">S${n+1} <b>${r.kg!=null&&r.kg!==''?r.kg+'×':(bw?'BW×':'')}${r.reps??'—'}</b> ×</span>`).join('')}<span class="note" style="font-size:11px;align-self:center">${rows.length}/${tgt}</span></div>`:'';
  return `<div class="log" style="grid-template-columns:1fr 1fr auto;margin-top:8px;align-items:end"><div><label>${isBoxEx(x)?'height (cm)':bw?'kg (0 = BW)':'kg'}</label><input type="number" step="2.5" data-entry="${prefix}" data-f="kg" value="${last.kg??def.kg??''}" placeholder="${def.kg??''}"></div><div><label>reps${secs?' / secs':''}</label><input type="number" data-entry="${prefix}" data-f="reps" value="${last.reps??def.reps??''}" placeholder="${def.reps??''}"></div><div><label>&nbsp;</label><button class="btn sm primary" data-logset="${prefix}" style="padding:9px 12px;white-space:nowrap">Log set ${rows.length+1}</button></div></div>${chips}`}
function openSession_(id,wk){const wi=weekIndex(pdate(wk));const s0=sessions(wi).find(x=>x.id===id);if(!s0)return;const L=S.log[wk+'|'+id]||{sets:{}};rowSets=Object.fromEntries(Object.entries(L.sets||{}).filter(([q])=>/s\d+$/.test(q)||/^cnt\d+$/.test(q)));const s=withExtras(s0,wk);
  const body=s.ex.map((x,i)=>{const lib=LIB[x.e];const k=x.extra!=null?'x'+x.extra:x.e+(x.sub||'');const v=L.sets[x.burpee?'be':x.sauna?'sa':k]||{};

    if(x.sauna){log=`<div class="log"><div><label>minutes</label><input type="number" data-k="sa" data-f="min" value="${v.min??''}" placeholder="0 = skipped"></div><div><label>°C</label><input type="number" data-k="sa" data-f="temp" value="${v.temp??''}" placeholder="85"></div></div>`}

    return `<div class="ex"><div class="row"><div class="sp"><div class="blk">${esc(x.blk)}${x.swapped?' · <span style="color:var(--power)">swapped</span>':''}</div><div class="nm" data-ex="${x.e}" style="cursor:pointer">${esc(exName(x))} <span style="color:var(--dim);font-weight:400">ⓘ</span></div></div><a href="${videoUrl(x.e,x.name)}" target="_blank" rel="noopener" style="color:var(--run);text-decoration:none;font-family:var(--mono);padding:4px 8px">▶</a>${canSwap?`<button class="btn sm" data-swap="${i}" style="font-size:12px">${x.swapped?'↺':'↔ swap'}</button>`:''}</div><div class="rx">${esc(x.rx)}</div><div class="cue">${esc(exCue(x))}</div>${lv}${log}</div>`}).join('');
  modal(`<span class="pill ${s.type}">${s.type}</span>&nbsp; <b>${esc(s.title)}</b>`,

function chart(h,k1,k2,col){if(!h.length)return '<p class="note">No data yet.</p>';const W=320,H=140,p=28;const vals=[...h.map(x=>x[k1]),...h.map(x=>x[k2])];const mn=Math.floor(Math.min(...vals)/5)*5-5,mx=Math.ceil(Math.max(...vals)/5)*5+5;
  const X=i=>p+(h.length===1?W/2-p:i*(W-2*p)/(h.length-1)),Y=v=>H-p+ (mn-v)*(H-2*p)/(mx-mn);
  const path=k=>h.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x[k]).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><text x="2" y="${Y(mx)+4}">${mx}</text><text x="2" y="${Y(mn)+4}">${mn}</text><line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="var(--line)"/>
  <path d="${path(k1)}" fill="none" stroke="var(${col})" stroke-width="2.5"/><path d="${path(k2)}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 3"/>
  ${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[k1])}" r="3" fill="var(${col})"/>`).join('')}<text x="${W-p}" y="12" text-anchor="end">e1RM — · 5RM ┄</text></svg>`}
function bindAfterProgress(){bindEngine()}
function chartBox(h){const B=S.box;if(!h.length)return `<p class="note">Log box jumps as height × reps per set in a power session. Now ${B.cur}${B.unit}, goal ${B.goal}${B.unit}.</p>`;const W=320,H=140,p=28;const vals=[...h.map(x=>x.h),...h.map(x=>x.cur),B.goal];const st=boxStep();const mn=Math.min(...vals)-st*2,mx=Math.max(...vals)+st*2;
  const X=i=>p+(h.length===1?W/2-p:i*(W-2*p)/(h.length-1)),Y=v=>H-p+(mn-v)*(H-2*p)/(mx-mn);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${p}" x2="${W-p}" y1="${Y(B.goal)}" y2="${Y(B.goal)}" stroke="var(--run)" stroke-dasharray="4 3"/><text x="${W-p}" y="${Y(B.goal)-4}" text-anchor="end">${B.goal}${B.unit} goal</text>
  <path d="${h.map((x,i)=>`${i?'L':'M'}${X(i)},${Y(x.cur)}`).join('')}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 3"/>
  ${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.h)}" r="4" fill="${x.clean?'var(--power)':'var(--heavy)'}"/>`).join('')}<text x="2" y="${Y(mx)+4}">${mx}</text><text x="2" y="${Y(mn)+4}">${mn}</text><text x="${p}" y="12">● clean · ● loud · ┄ working height</text></svg>`}
function engineCard(){const E=S.engine||{k5:[],p20:[]};const k=E.k5.slice(-8),p=E.p20.slice(-8);
  const row=(arr,fmt,col)=>arr.length?`<div class="ladder" style="height:60px;gap:3px">${arr.map(x=>`<div style="height:${Math.max(15,100*x.v/Math.max(...arr.map(y=>y.v)))}%;background:var(${col})"><span>${fmt(x.v)}</span></div>`).join('')}</div>`:'<p class="note">Nothing logged yet.</p>';

function bindEngine(){steppers(app);const b=$('#engSave');if(!b)return;b.onclick=()=>{S.engine=S.engine||{k5:[],p20:[]};const d=iso(new Date());const m=+$('#k5m').value,sc=+$('#k5s').value||0,w=+$('#p20').value;let n=0;if(m){S.engine.k5.push({d,v:m*60+sc});n++}if(w){S.engine.p20.push({d,v:w});n++}if(!n)return toast('Enter a time or watts');save();progress();toast('Logged')}}
function muscleBars(){const m=weekSets(weekIndex());const order=[['glutes',10,20],['quads',8,16],['hams',6,14],['calves',4,10],['back',8,16],['shoulders',6,12],['core',3,8],['neck',3,9],['chest',2,8],['arms',2,8],['power',8,16],['cond',1,4]];const mx=Math.max(20,...Object.values(m));

function tonnageChart(){const d=tonnageByWeek();if(!d.length)return '<p class="note">Log sets live and tonnage appears here.</p>';const mx=Math.max(...d.map(x=>x[1]));return `<div class="ladder" style="height:90px">${d.map(([wk,t])=>`<div style="height:${100*t/mx}%;background:var(--heavy)"><span>${(t/1000).toFixed(1)}t</span></div>`).join('')}</div><p class="note">Weeks ${d[0][0].slice(5)} → ${d[d.length-1][0].slice(5)}. Live-logged sets exact; sheet-only logs estimated at 3 sets.</p>`}
function adherence(){const n=26;const wi=weekIndex();const cells=[];for(let w=0;w<n;w++){const wk=iso(weekStart(w));const ss=sessions(w).filter(s=>!isBonus(s.id));const dn=ss.filter(s=>S.log[wk+'|'+s.id]?.done).length;cells.push({w,wk,dn,tot:ss.length,fut:w>wi})}
  const done=cells.filter(c=>!c.fut).reduce((a,c)=>a+c.dn,0),tot=cells.filter(c=>!c.fut).reduce((a,c)=>a+c.tot,0);
  return `<div class="row" style="margin-bottom:8px"><span class="eyebrow">${tot?Math.round(100*done/tot):0}% of scheduled sessions done · week ${wi+1} of 26</span></div><div class="cal" style="grid-template-columns:repeat(13,1fr);gap:3px">${cells.map(c=>{const pct=c.tot?c.dn/c.tot:0;const bg=c.fut?'var(--panel2)':pct>=1?'var(--ok)':pct>0?'color-mix(in srgb,var(--ok) 45%,var(--panel2))':'var(--heavy)';return `<div title="W${c.w+1}: ${c.dn}/${c.tot}" style="height:22px;border-radius:4px;background:${bg};opacity:${c.fut?.5:1};border:${c.w===wi?'2px solid var(--power)':'0'}"></div>`}).join('')}</div><p class="note">Green = every session that week done; red = none; faded = not yet. This is the app evaluation: adherence here, numbers above.</p>`}
function chartSec(h){if(!h.length)return '<p class="note">Log the EMOM minutes you hit in Power I and the projected time appears here.</p>';const W=320,H=140,p=28;const vals=h.map(x=>x.sec);const mn=Math.min(...vals,540)-30,mx=Math.max(...vals,600)+30;

  <path d="${h.map((x,i)=>`${i?'L':'M'}${X(i)},${Y(x.sec)}`).join('')}" fill="none" stroke="var(--power)" stroke-width="2.5"/>${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.sec)}" r="3" fill="var(--power)"/><text x="${X(i)}" y="${Y(x.sec)-8}" text-anchor="middle">${fmtSec(x.sec)}</text>`).join('')}</svg>`}

   +cats.map(([c,t,cls])=>{const rows=Object.entries(LIB).filter(([k,v])=>v.cat===c&&k!=='custom'&&!v.mine&&hit(k,v));return rows.length?`<div class="card"><h3><span class="pill ${cls}">${t}</span> <span class="eyebrow">${rows.length}</span></h3>${rows.map(([k,v])=>`<div class="ex" data-ex="${k}" style="cursor:pointer"><div class="row"><div class="nm sp">${S.fav[k]?'★ ':''}${esc(v.n)}</div><span class="eyebrow">${esc(v.eq||'')}</span><a href="${videoUrl(k)}" target="_blank" rel="noopener" data-vid style="color:var(--run);text-decoration:none;font-family:var(--mono);font-size:13px;padding:2px 6px">▶</a></div><div class="cue">${esc(v.cue)}</div>${(v.m||[]).length?`<div style="margin-top:4px">${v.m.map((g,i)=>`<span class="pill" style="margin-right:4px;${i?'':'border-color:var(--mute);color:var(--ink)'}">${g}</span>`).join('')}${S.exlog[k]?`<span class="pill ok">logged ${S.exlog[k].length}×</span>`:''}</div>`:''}</div>`).join('')}</div>`:''}).join('')+(q||F.m||F.eq||F.fav?'':guide());
  $('#libQ').oninput=e=>{library.q=e.target.value;const pos=e.target.selectionStart;library();$('#libQ').focus();$('#libQ').setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{library.f=library.f||{};const k=b.dataset.f,v=k==='fav'?1:b.dataset.v;library.f[k]=library.f[k]===v||(k==='fav'&&library.f.fav)?undefined:v;library()});
  document.querySelectorAll('[data-vid]').forEach(a=>a.onclick=e=>e.stopPropagation());
  document.querySelectorAll('[data-ex]').forEach(el=>el.onclick=()=>exDetail(el.dataset.ex,library))}
function guide(){return `<div class="card guide"><h3>Principles & safety</h3>
<h2>Why this shape</h2><p class="note">Heavy, low-rep compounds (3–6 @ 80–90%, 1–3 RIR) improve running and cycling economy without adding mass. Power and plyometrics — done first, fresh, with full recovery — sharpen rate of force development and tendon stiffness, which feeds running economy. Hypertrophy work is dosed to the muscles that fail first in Hyrox and long climbs, and capped so it doesn't blunt cardio quality.</p>
<h2>Compromised running</h2><p class="note">Running immediately after lifting trains your gait under neuromuscular fatigue — the Hyrox condition. Keep it easy on Strength A day; use tempo on Strength B day only in build weeks. If a key coach session falls within 6h, drop the compromised run rather than the coach session.</p>
<h2>Progression rules</h2><ul class="note"><li>Top set hit with ≥2 RIR → +2.5kg to 5RM.</li><li>Hit with 1 RIR → hold.</li><li>Missed reps → −5%, rebuild.</li><li>Deload every 4th week: ~70%, half the sets, shorter EMOM. No test days — progress is read from the log.</li>
<li>Box jump: log each set as height × reps. Every prescribed set completed at full reps on the working height → +2.5cm next power session. A set cut short at the working height → −2.5cm; a short set on a higher box just holds. Still land quietly — if you can't, the reps don't count. Never chase a max on tired legs; the height you can land on is the height that transfers.</li></ul>
<h2>Plyometric loading</h2><ul class="note"><li>Start with pogos and low box jumps; add single-leg hops once bilateral landings are quiet.</li><li>Depth jumps only in peak weeks and only if the previous two weeks were pain-free.</li><li>Stop any plyo set the moment ground contact gets slow or landings get loud — power work past fatigue is just impact.</li><li>Nordics once a week maximum inside heavy endurance blocks.</li></ul>
<h2>Glutes · strength and shape</h2><p class="note">Glute max grows from heavy hip extension under stretch (squat, RDL, split squats with the torso forward) plus a short-range squeeze (hip thrust, 45° hip extension, kickbacks); glute med and upper glute max — the "shelf" — come from abduction and single-leg work. Every strength day ends with one rotating glute movement taken close to failure, and Strength C is glute-led: 4 sets of thrusts, a lunge/sumo alternation, then an isolation burn. Across three sessions that is 10–14 direct glute sets a week on top of the compounds — enough to build, not enough to dent the running. The squat-to-100 and RDL-to-90 lines are the biggest glute builders in the plan; the rest is finishing.</p>
<h2>Tabata and interval weight work</h2><p class="note">Two kinds of fatigue work live in the plan. <b>Tabata</b> (20s on / 10s off × 8 with kettlebells, DB thrusters or the rower) sits at the end of Power II and in the finisher rotation — four minutes, maximal, the clock in the app runs it. <b>Interval weight work</b> (EMOM squat/swing complexes, every-2-min RDL + run, every-90s lunges + burpees) sits in Strength C and the finishers: moderate loads lifted on legs that never fully recover between rounds, which is the Hyrox and late-climb condition. Neither replaces the heavy sets — they come after them.</p>
<h2>Autoregulation</h2><p class="note">Live mode opens with a 10-second readiness check (sleep, soreness, energy). Score ≤4/9 offers −7.5% on the heavy loads for that session only; the progression rules still read the sets you actually did. Session RPE × minutes gives a daily training load; the acute:chronic ratio on Today (7-day vs 28-day) flags spikes above 1.3–1.5 — the range where injury risk climbs — and detraining below 0.8.</p>
<h2>Videos</h2><p class="note">Every exercise has a ▶ that opens a YouTube search for that movement, pinned to a coach worth copying for the key lifts (Squat University, StrongFirst, Bret Contreras, E3 Rehab, Catalyst Athletics, Alan Thrall, Knees Over Toes Guy). Searches rather than fixed links, so they don\'t rot when a video is pulled, and anything you add yourself gets one too.</p>
<h2>Finishing early</h2><p class="note">When every session in the plan-week is done with days to spare, Today offers two things: <b>Start next week now</b> — the next plan-week begins today, so the waves keep moving and you don\'t sit idle (the week boundary is remembered; logs and adherence stay intact) — or an optional <b>bonus session</b>: a light glute-and-upper pump or a short power-and-conditioning piece. Bonus sessions don\'t count toward adherence and don\'t touch the progression; they exist so a free day has something sensible in it rather than a third heavy leg day.</p>
<h2>Ramps, fillers, circuit</h2><p class="note">Every heavy lift is preceded by a warm-up ramp generated from today\'s top set (bar×8, 50%×5, 65%×3, 75%×1) — rehearsal, not work, and not logged. The surgeon back & neck movements are offered as fillers during the 3-minute heavy rests: low-fatigue, nothing the squat notices, and the block gets done instead of skipped. The split squat / calf / carry block runs as a circuit with 60s rest; none of those are recovery-limited at these loads, so it saves 6–8 minutes for free. All three can be turned off in Setup.</p>
<h2>Exercises you add</h2><p class="note">Type any exercise into "Add an exercise you did" (in the sheet or live) and it is learned into the library under <b>Yours</b>, with muscles and category guessed from the name. From then on it logs per set, gets a suggested load next time, counts towards weekly coverage, and has a video link. Open it in the library to correct the muscles or forget it. If the name matches a built-in exercise, that one is used instead.</p>
<h2>Counters</h2><p class="note">Burpee exercises have a tap counter (+1 / +5); the EMOM turns the count into minutes at pace. Every interval piece — tabata, EMOM complexes, AMRAP finishers, sprint repeats — has a rounds counter. In live mode the clock fills it in as rounds complete; for an AMRAP you tap each round yourself. Counts autosave and carry between the sheet and live.</p>
<h2>Suggested loads</h2><p class="note">Squat and RDL are driven by the 5RM and RIR rules. Everything else progresses by double progression once you have logged it once: if every set hit the top of the rep range, the next session suggests +2.5kg (2kg for dumbbells/kettlebells) and drops back to the bottom of the range; if a set missed the bottom, it suggests easing off; otherwise same load, one more rep. The suggestion prefills the entry line and shows what you did last time, so you see the improvement rather than having to remember it. Bodyweight movements progress by reps.</p>
<h2>Logging during a session</h2><p class="note">Run session live: every set has kg and reps fields prefilled from the prescription; tapping "set done" records them and (if the timer is on) starts the rest clock. The best set feeds the progression automatically. Anything extra you did — a sled drag, an arm pump — goes in with "＋ add exercise" and is logged like the rest.</p>
<h2>Surgeon block · why it's there</h2><p class="note">Long cases load the cervical extensors, deep neck flexors, lower traps and erector spinae isometrically for hours — low force, no rest. That's an endurance problem, not a strength one, so the block uses holds and high reps (10s holds, 20–30 rep bands, 30–45s back extensions) rather than load. It sits at the end of each strength session, rotates with the wave, costs ~7 minutes and never goes to failure. Pull-aparts and chin tucks are worth doing between cases as well. Toggle it off in Setup if a wave is already heavy.</p>
<h2>Burpee standard</h2><p class="note">Chest to floor, feet together jump-in, jump with clap overhead. The EMOM ladder adds a rep per minute each build week over 26 weeks. Your 100-burpee time is projected from the minutes you hit — hitting all 10 minutes at 10/min is 100 in 10:00 by definition — so there is nothing to test.</p>
<h2>Sauna · heat acclimation</h2><p class="note">Post-exercise sauna (the Scoon protocol: ~30 min at ~90°C after runs, 3 weeks) expands plasma volume and improves endurance performance. Build from 10–15 min to 20–30 min at 80–90°C, within 30 minutes of finishing runs and power sessions, 3–4 times a week. Sit, don't train in it. Drink 500ml–1L afterwards — you lose roughly a litre per half hour. Skip it when dehydrated, unwell, or after alcohol. After heavy strength days it's optional; keep it to 15 min if you go in.</p></div>`}

function settings(){const st=S.structure,sl=S.slots;const sq=S.lifts.squat,rd=S.lifts.rdl;
  const seg=(k,opts)=>`<div class="seg" data-seg="${k}">${opts.map(o=>`<button class="${st[k]===o?'on':''}" data-v="${o}">${o}</button>`).join('')}</div>`;
  const daySel=(k,l)=>`<div class="field"><label>${l}</label><select data-slot="${k}">${DAYS.map((d,i)=>`<option value="${i}" ${sl[k]===i?'selected':''}>${d}</option>`).join('')}</select></div>`;
  app.innerHTML=`<div class="card"><h3>Weekly structure</h3>
   <div class="field"><label>Strength sessions</label>${seg('strength',[2,3])}</div>
   <div class="field"><label>Power & plyo sessions</label>${seg('power',[1,2])}</div>
   <div class="field"><label>Compromised runs (attached to A, then B)</label>${seg('runs',[1,2])}</div>
   <div class="field"><label>Intensity</label><div class="seg" data-segl="level"><button class="${st.level==='athlete'?'on':''}" data-v="athlete">Athlete</button><button class="${st.level!=='athlete'?'on':''}" data-v="standard">Standard</button></div><p class="note">Athlete: AMRAP top set in peak weeks (big jumps when you smash it), rotating density finisher on A and B, no finisher in deload. Standard: the straight sets only.</p></div>
   <div class="field"><label>Deload style (week 4 of each wave)</label><div class="seg" data-segd="deload"><button class="${st.deload!=='endurance'?'on':''}" data-v="light">Light & short</button><button class="${st.deload==='endurance'?'on':''}" data-v="endurance">High-rep endurance</button></div><p class="note">Light & short: 2×5 @ 70%, accessories as written, fewer sets. High-rep endurance: squat and RDL 2×15 @ 55% with a 1×20 back-off, accessories 2×15–20 light — same low tonnage, nothing near failure, so fatigue still clears, but you get the muscular-endurance exposure. Plyos, intervals and sauna unchanged.</p></div>
   <div class="field"><label>Scheduling</label><div class="seg" data-segb="floating"><button class="${st.floating!==false?'on':''}" data-v="1">Floating order</button><button class="${st.floating===false?'on':''}" data-v="0">Fixed days</button></div><p class="note">Floating: sessions in sequence, done whenever the rota allows; weeks run from your start date. Fixed: each session on a set weekday (slots below).</p></div>
   <div class="field"><label>Session structure</label>
    <div class="row wrap" style="gap:8px"><div class="seg" data-segb="ramps" style="flex:1"><button class="${st.ramps!==false?'on':''}" data-v="1">Ramps on</button><button class="${st.ramps===false?'on':''}" data-v="0">off</button></div><div class="seg" data-segb="fillers" style="flex:1"><button class="${st.fillers!==false?'on':''}" data-v="1">Fillers on</button><button class="${st.fillers===false?'on':''}" data-v="0">off</button></div><div class="seg" data-segb="saver" style="flex:1"><button class="${st.saver!==false?'on':''}" data-v="1">Circuit on</button><button class="${st.saver===false?'on':''}" data-v="0">off</button></div></div>
    <p class="note">Ramps: bar → 50 → 65 → 75% before each heavy lift. Fillers: the back & neck work done in the heavy rests instead of at the end. Circuit: split squat / calves / carry as a rolling circuit with 60s rest instead of straight sets.</p></div>
   <div class="field"><label>Rest timer in live mode</label><div class="seg" data-segb="timer"><button class="${st.timer!==false?'on':''}" data-v="1">On</button><button class="${st.timer===false?'on':''}" data-v="0">Off</button></div><p class="note">Off = tap sets only, no countdown. Interval clocks (Tabata / EMOM) still run when you start them.</p></div>
   <div class="field"><label>Surgeon block · back & neck endurance (end of each strength session, ~7 min)</label><div class="seg" data-segb="surgeon"><button class="${st.surgeon?'on':''}" data-v="1">On</button><button class="${!st.surgeon?'on':''}" data-v="0">Off</button></div></div></div>
  ${st.floating===false?`<div class="card"><h3>Day slots</h3><p class="note">Keep A and B ≥48h apart; put power sessions on days before or well away from key cardio.</p><div class="grid2">${daySel('A','Strength A · squat')}${daySel('B','Strength B · hinge')}${st.strength===3?daySel('C','Strength C · hypertrophy'):''}${daySel('P1','Power I')}${st.power===2?daySel('P2','Power II'):''}</div></div>`:''}
  <div class="card"><h3>Lifts</h3><div class="grid2">
   <div class="field"><label>Squat 5RM</label><input type="number" step="2.5" data-l="squat" data-f="rm5" value="${sq.rm5}"></div><div class="field"><label>Squat goal</label><input type="number" step="2.5" data-l="squat" data-f="goal" value="${sq.goal}"></div>
   <div class="field"><label>RDL 5RM</label><input type="number" step="2.5" data-l="rdl" data-f="rm5" value="${rd.rm5}"></div><div class="field"><label>RDL goal</label><input type="number" step="2.5" data-l="rdl" data-f="goal" value="${rd.goal}"></div>
   <div class="field"><label>100-burpee time (sec, optional manual)</label><input type="number" id="bpb" value="${S.burpee.best??''}"></div><div class="field"><label>Start week</label><input type="date" id="sd" value="${S.startDate}"></div>
   <div class="field"><label>Box jump now (cm)</label><input type="number" step="2.5" id="bxc" value="${S.box.cur}"></div><div class="field"><label>Box jump goal (cm)</label><input type="number" step="2.5" id="bxg" value="${S.box.goal}"></div>
   <div class="field"><label>Bar weight (kg)</label><input type="number" id="barw" value="${S.bar}"></div>
   <div class="field"><label>Smallest plate you own (kg, per side)</label><select id="plateSel">${[1.25,2.5,5].map(v=>`<option value="${v}" ${(S.plate||1.25)===v?'selected':''}>${v} kg → loads jump by ${v*2} kg</option>`).join('')}</select></div>
   </div>
   <button class="btn primary full" id="saveSet">Save settings</button></div>
  <div class="card"><h3>Plan controls</h3><div class="row wrap"><button class="btn sm" id="undoSet" ${S.undo?'':'disabled'}>Undo last completion</button><button class="btn sm" id="advSet">Start next week now</button><button class="btn sm" id="dlSet">${(S.deloadWeeks||[]).includes(weekIndex())?'Un-deload this week':'Deload this week'}</button></div><p class="note">Forced deloads: ${(S.deloadWeeks||[]).length?S.deloadWeeks.map(w=>'W'+(w+1)).join(', '):'none'}.</p></div>
  <div class="card"><h3>Diagnostics</h3><p class="note">v${(document.querySelector('meta[name=app-version]')||{}).content||'?'} · ${navigator.userAgent.replace(/.*\((.*?)\).*/,'$1').slice(0,60)} · ${location.protocol==='https:'?'installed/site':'file'} · storage ${memOnly?'blocked':'ok'}</p>${(S.errlog||[]).length?`<pre style="font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--mute);max-height:160px;overflow:auto">${esc((S.errlog||[]).map(r=>`${r.t} ${r.ours?'[app]':'[other]'} ${r.msg}${r.file?' '+r.file.split('/').pop()+':'+r.line+':'+r.col:''}${r.stack?'\n   '+r.stack:''}`).join('\n'))}</pre><div class="row"><button class="btn sm" id="errCopy">Copy log</button><button class="btn sm" id="errClear">Clear</button></div>`:'<p class="note">No errors recorded.</p>'}</div>
  <div class="card"><h3>Alerts</h3><div class="row"><span class="note">Rest-over and interval alerts when the screen is off (install to Home Screen first).</span><span class="sp"></span><button class="btn sm" id="ntf">${S.notify&&('Notification'in window)&&Notification.permission==='granted'?'On ✓':'Enable'}</button></div></div>
  <div class="card"><h3>Data</h3><div class="row wrap"><button class="btn sm primary" id="bk">Back up to Files</button><button class="btn sm" id="exp">Export JSON</button><button class="btn sm" id="expCsv">Export CSV</button><button class="btn sm" id="imp">Import</button><span class="sp"></span><button class="btn sm danger" id="reset">Reset</button></div><p class="note">${S.lastBackup?'Last backup '+S.lastBackup:'Never backed up'} · data is on this device only.</p><input type="file" id="impFile" accept="application/json" hidden></div>`;
  $('#bk').onclick=()=>{doBackup();settings()};
  if($('#errCopy'))$('#errCopy').onclick=()=>{const t=JSON.stringify(S.errlog||[],null,1);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),()=>{prompt('Copy this:',t)})};if($('#errClear'))$('#errClear').onclick=()=>{S.errlog=[];ERRS.length=0;save();settings()};
  $('#expCsv').onclick=()=>{const rows=[['date','week','session','exercise','set','kg','reps','rir','rpe','mins','readiness']];Object.entries(S.log).forEach(([k,l])=>{if(!l.done)return;const [wk,sid]=k.split('|');const wi=Math.max(0,Math.round((pdate(wk)-weekStart(0))/6048e5));const ss=sessions(wi).find(x=>x.id===sid);const s=ss?withExtras(ss,wk):null;if(s&&l.live)Object.entries(l.live).forEach(([i,a])=>(a||[]).forEach((st,n)=>st&&rows.push([l.at,wi+1,sid,exName(s.ex[i]||{e:'custom'}),n+1,st.kg??'',st.reps??'','',l.rpe??'',l.mins??'',l.ready??''])));Object.entries(l.sets||{}).forEach(([key,v])=>{if(v.kg||v.reps){const gm=key.match(/^g(\d+)s(\d+)$/);const lm=!gm&&key.match(/^(\w+?)(backoff)?s(\d+)$/);const nm=gm&&s&&s.ex[+gm[1]]?exName(s.ex[+gm[1]]):lm&&LIB[lm[1]]?LIB[lm[1]].n+(lm[2]?' (back-off)':''):key;rows.push([l.at,wi+1,sid,nm,gm?+gm[2]+1:lm?+lm[3]+1:'top',v.kg??'',v.reps??'',v.rir??'',l.rpe??'',l.mins??'',l.ready??''])}})});
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='ballast-'+iso(new Date())+'.csv';a.click();toast(rows.length-1+' rows')};
  $('#undoSet')&&($('#undoSet').onclick=()=>{undoLast();settings()});
  $('#advSet').onclick=()=>{advanceWeek();settings()};
  $('#dlSet').onclick=()=>{const wi=weekIndex();const d=S.deloadWeeks||[];S.deloadWeeks=d.includes(wi)?d.filter(x=>x!==wi):[...d,wi];save();settings()};
  $('#ntf').onclick=async()=>{if(!('Notification'in window)){toast('Not supported in this browser');return}const r=await Notification.requestPermission();S.notify=r==='granted';save();settings();toast(S.notify?'Alerts on':'Alerts blocked by the browser')};
  steppers(app);
  document.querySelectorAll('[data-seg] button').forEach(b=>b.onclick=()=>{S.structure[b.parentElement.dataset.seg]=+b.dataset.v;save();settings()});
  document.querySelectorAll('[data-segl] button').forEach(b=>b.onclick=()=>{S.structure.level=b.dataset.v;save();settings()});
  document.querySelectorAll('[data-segd] button').forEach(b=>b.onclick=()=>{S.structure.deload=b.dataset.v;save();settings()});
  document.querySelectorAll('[data-segb] button').forEach(b=>b.onclick=()=>{S.structure[b.parentElement.dataset.segb]=b.dataset.v==='1';save();settings()});
  document.querySelectorAll('[data-slot]').forEach(s=>s.onchange=()=>{S.slots[s.dataset.slot]=+s.value;save()});
  $('#saveSet').onclick=()=>{document.querySelectorAll('[data-l]').forEach(i=>{S.lifts[i.dataset.l][i.dataset.f]=+i.value});S.burpee.best=$('#bpb').value?+$('#bpb').value:null;S.box.cur=+$('#bxc').value||S.box.cur;S.box.goal=+$('#bxg').value||S.box.goal;S.box.unit='cm';if(S.base){if(!S.box.hist.length)S.base.box=S.box.cur;if(!S.lifts.squat.hist.length)S.base.sq=S.lifts.squat.rm5;if(!S.lifts.rdl.hist.length)S.base.rd=S.lifts.rdl.rm5}S.bar=+$('#barw').value||20;S.plate=+($('#plateSel')&&$('#plateSel').value)||1.25;S.startDate=$('#sd').value||S.startDate;save();toast('Saved')};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S));a.download='ballast-'+iso(new Date())+'.json';a.click()};
  $('#imp').onclick=()=>$('#impFile').click();$('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{S=deepMerge(clone(DEFAULT),JSON.parse(t));save();render();toast('Imported')})};
  $('#reset').onclick=()=>{if(confirm('Wipe all BALLAST data?')){localStorage.removeItem(KEY);S=clone(DEFAULT);render()}}}

render();
